name: Package

# Builds the .deb and the AppImage in an Ubuntu 22.04 container (oldest supported base, so the
# minimum library versions fit every newer system). Then installs, runs and removes the .deb on
# Ubuntu 22.04, 24.04 and 26.04, and runs the AppImage on Ubuntu 22.04, Debian, Fedora, Arch and
# openSUSE.
# The release workflow will call this one (workflow_call) to attach the result to a release.

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "crates/**"
      - "packaging/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/package.yml"
  pull_request:
    paths:
      - "app/**"
      - "crates/**"
      - "packaging/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/package.yml"

env:
  CARGO_TERM_COLOR: always
  DEBIAN_FRONTEND: noninteractive

jobs:
  deb:
    name: Build .deb and AppImage (Ubuntu 22.04)
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential nasm curl ca-certificates git \
            xz-utils pkg-config clang libclang-dev libfontconfig1-dev libxkbcommon-dev python3 \
            dpkg-dev file
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-about
            target/bundled
            target/ffmpeg-src
            target/appimage-tools
          key: deb-ubuntu2204-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'packaging/ffmpeg/build.sh') }}
          restore-keys: deb-ubuntu2204-
      - name: Install cargo-about
        run: command -v cargo-about || cargo install cargo-about --locked --features cli
      - name: Build .deb
        run: packaging/deb/build.sh dist
      - name: Build AppImage
        run: packaging/appimage/build.sh dist
      - name: Show packages
        run: |
          dpkg-deb -I dist/*.deb
          dpkg-deb -c dist/*.deb
          ls -la dist
      - uses: actions/upload-artifact@v7
        with:
          name: deb
          path: dist/*.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: dist/*.AppImage
          if-no-files-found: error

  install:
    name: Install on ${{ matrix.image }}
    needs: deb
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:22.04", "ubuntu:24.04", "ubuntu:26.04"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: deb
      - name: Install
        run: |
          apt-get update
          apt-get install -y ./chronoclip_*.deb
      - name: Check
        run: |
          set -euxo pipefail
          chronoclip --version
          ldd /usr/bin/chronoclip
          if ldd /usr/bin/chronoclip | grep "not found"; then exit 1; fi
          # The runpath makes ldd print /usr/bin/../lib/chronoclip/…
          ldd /usr/bin/chronoclip | grep -q "/lib/chronoclip/libavcodec.so"
          # Libraries the app loads at runtime must come with the package's dependencies.
          for lib in libX11.so.6 libX11-xcb.so.1 libxcb.so.1 libXcursor.so.1 libXi.so.6 \
                     libxkbcommon.so.0 libxkbcommon-x11.so.0 libXcomposite.so.1 libGL.so.1 \
                     libpulse.so.0 libpulse-simple.so.0; do
            ldconfig -p | grep -q "$lib " || { echo "missing $lib"; exit 1; }
          done
          command -v xdg-open
          test -f /usr/share/applications/io.github.etse.chronoclip.desktop
          test -f /usr/share/icons/hicolor/256x256/apps/io.github.etse.chronoclip.png
          test -f /usr/share/metainfo/io.github.etse.chronoclip.metainfo.xml
          # Ubuntu's container images are minimized: dpkg skips /usr/share/doc except copyright
          # files. So check the license files in the package itself.
          test -f /usr/share/doc/chronoclip/copyright
          for doc in FFMPEG-LICENSE.txt COPYING.LGPLv2.1 THIRD-PARTY-LICENSES.txt.gz; do
            dpkg-deb -c ./chronoclip_*.deb | grep "/usr/share/doc/chronoclip/$doc" > /dev/null
          done
      - name: Remove
        run: |
          apt-get remove -y chronoclip
          test ! -e /usr/bin/chronoclip
          test ! -e /usr/lib/chronoclip

  appimage:
    name: Run AppImage on ${{ matrix.image }}
    needs: deb
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: "ubuntu:22.04"
            setup: apt-get update && apt-get install -y libfontconfig1
          - image: "debian:12"
            setup: apt-get update && apt-get install -y libfontconfig1
          - image: "fedora:latest"
            setup: dnf install -y fontconfig
          - image: "archlinux:latest"
            setup: pacman -Sy --noconfirm fontconfig
          - image: "opensuse/tumbleweed:latest"
            setup: zypper --non-interactive install fontconfig
    defaults:
      run:
        shell: sh
    steps:
      - name: Install fontconfig (part of every desktop, not of minimal containers)
        run: ${{ matrix.setup }}
      - uses: actions/download-artifact@v8
        with:
          name: appimage
      - name: Run
        env:
          # Containers have no FUSE: let the AppImage extract itself to a temporary directory.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -eux
          chmod +x ./Chronoclip-*-x86_64.AppImage
          ./Chronoclip-*-x86_64.AppImage --version
          ./Chronoclip-*-x86_64.AppImage --appimage-extract > /dev/null
          ldd squashfs-root/usr/bin/chronoclip
          if ldd squashfs-root/usr/bin/chronoclip | grep "not found"; then exit 1; fi
          ldd squashfs-root/usr/bin/chronoclip | grep "/lib/chronoclip/libavcodec.so" > /dev/null
          test -f squashfs-root/usr/share/doc/chronoclip/FFMPEG-LICENSE.txt
          test -f squashfs-root/usr/share/doc/chronoclip/THIRD-PARTY-LICENSES.txt
