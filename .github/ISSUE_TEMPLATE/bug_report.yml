name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Chronoclip version
  - type: input
    id: system
    attributes:
      label: OS, GPU and encoder
      placeholder: Windows 11 24H2, RTX 4070, NVENC H.264
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: text
