[workspace]
resolver = "3"
members = ["app", "crates/chronoclip-core", "crates/chronoclip-encode", "crates/chronoclip-capture"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
chronoclip-core = { path = "crates/chronoclip-core" }
chronoclip-encode = { path = "crates/chronoclip-encode" }
chronoclip-capture = { path = "crates/chronoclip-capture" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
directories = "6"
ffmpeg-next = { version = "8", default-features = false, features = ["codec", "format"] }
gl = "0.14"
libc = "0.2"
libloading = "0.8"
# 4.19 moved to zbus 6; Slint (accesskit) uses zbus 5, so stay on 4.18 to avoid two copies.
notify-rust = "~4.18"
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"
# Default features minus `renderer-femtovg`: the software renderer draws text on whole pixels
# (femtovg made labels wavy) and keeps OpenGL out of the UI, next to our own GLX capture.
slint = { version = "1.19", default-features = false, features = ["std", "backend-default", "renderer-software", "accessibility", "compat-1-2", "system-tray", "unstable-winit-030"] }
slint-build = "1"
tempfile = "3"
thiserror = "2"
toml = "0.8"
x11-dl = "2"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
