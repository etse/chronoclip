[workspace]
resolver = "3"
members = ["app", "crates/chronoclip-core", "crates/chronoclip-encode", "crates/chronoclip-capture"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
chronoclip-core = { path = "crates/chronoclip-core" }
chronoclip-encode = { path = "crates/chronoclip-encode" }
chronoclip-capture = { path = "crates/chronoclip-capture" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
directories = "6"
ffmpeg-next = { version = "8", default-features = false, features = ["codec", "format", "software-scaling"] }
gl = "0.14"
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
slint = "1"
slint-build = "1"
tempfile = "3"
thiserror = "2"
toml = "0.8"
x11-dl = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
