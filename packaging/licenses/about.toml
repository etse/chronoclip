# cargo-about configuration: collects the licenses of the Rust crates compiled into the
# chronoclip binary. Run packaging/licenses/generate.sh.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    "0BSD",
    "MPL-2.0",
    "WTFPL",
    # Slint is GPL-3.0-only OR royalty-free OR commercial; Chronoclip uses the royalty-free
    # desktop license (attribution in the About tab). cargo-about 0.9 can't include the text
    # of LicenseRef-* licenses, so generate.sh appends it.
    "LicenseRef-Slint-Royalty-free-2.0",
]
targets = ["x86_64-unknown-linux-gnu"]
ignore-build-dependencies = true
ignore-dev-dependencies = true

